<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons (Lucide/Feather equivalent via CDN or FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Styles if needed */
        body { font-family: sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="#home" class="flex items-center gap-2" onclick="navigate('home')">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-lg">E</span>
                    </div>
                    <span class="font-bold text-xl text-gray-900">E-Shop Pro</span>
                </a>

                <!-- Search (Hidden on small screens) -->
                <div class="hidden md:flex flex-1 max-w-md mx-8">
                    <div class="relative w-full">
                        <input type="text" placeholder="Search products..." class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                        <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-gray-400"></i>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-6">
                    <button class="relative text-gray-600 hover:text-blue-600 transition group" onclick="navigate('cart')">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
                    </button>
                    <button class="text-gray-600 hover:text-blue-600 transition" onclick="checkAuthAndNavigate()">
                        <i class="fa-solid fa-user text-xl"></i>
                    </button>
                    <button id="logout-btn" class="hidden text-red-600 hover:text-red-800 text-sm font-semibold" onclick="logout()">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow">
        <!-- Views will be injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="flex items-center gap-2 mb-4 md:mb-0">
                    <div class="w-6 h-6 bg-blue-600 rounded-md flex items-center justify-center">
                        <span class="text-white font-bold text-sm">E</span>
                    </div>
                    <span class="font-bold text-white">E-Shop Pro</span>
                </div>
                <p class="text-center md:text-right text-sm">
                    © 2025 E-Shop Pro. All rights reserved.
                </p>
            </div>
        </div>
    </footer>

    <!-- Application Script -->
    <script src="script.js"></script>
</body>
</html>
